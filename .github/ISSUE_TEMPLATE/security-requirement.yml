name: Security requirement
description: One of the R01-R20 security requirements
title: "Rxx: <short name>"
body:
  - type: textarea
    id: story
    attributes:
      label: Requirement / user story
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      options: [High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Chosen solution and alternatives considered
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The tests that prove the security property
