# Runs the tests and security checks on every pull request and on every push to main.
# R20: SAST (bandit) and dependency checking (pip-audit), the build-phase tools
# from Week 12 lecture s8. A failing check blocks the merge (ruleset on main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check for errors (syntax, undefined names, unused imports)
        run: ruff check --select E9,F .
      - name: Run tests
        run: pytest -q
      - name: Static analysis (bandit, R20)
        # -ll = only fail on medium and high severity issues
        run: bandit -r app scripts -ll
