# Runs the tests on every pull request and on every push to main.
# R20 (WS-E) adds security scanners here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check for errors (syntax, undefined names, unused imports)
        run: ruff check --select E9,F .
      - name: Run tests
        run: pytest -q
