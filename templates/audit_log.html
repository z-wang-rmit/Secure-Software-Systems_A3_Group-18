{% extends "base.html" %}
{% block title %}Audit log{% endblock %}
{% block content %}
<h2>Audit log</h2>
<table class="table table-sm">
    <tr><th>#</th><th>Time (UTC)</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr>
    {% for e in entries %}
    <tr><td>{{ e.id }}</td><td>{{ e.ts }}</td><td>{{ e.actor_id or "-" }}</td>
        <td>{{ e.action }}</td><td>{{ e.target }}</td><td>{{ e.detail }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
