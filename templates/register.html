{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card form-card">
    <div class="card-body">
        <h2 class="card-title">Create your online voting account</h2>
        <p class="text-muted">You must already be on the electoral roll. Your enrolment number is on your AEC letter.</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="enrolment_no">Enrolment number</label>
                <input class="form-control" id="enrolment_no" name="enrolment_no" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
</div>
{% endblock %}
